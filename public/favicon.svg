<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vann monogram">
  <defs>
    <linearGradient id="plate" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161616" />
      <stop offset="1" stop-color="#060606" />
    </linearGradient>
  </defs>

  <!-- Plate -->
  <rect width="64" height="64" rx="14" fill="url(#plate)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Monogram: thick stem in white, thin stem in red (high stroke contrast) -->
  <path d="M13 15 L24 15 L32.4 37 L32.4 49 Z" fill="#ffffff" />
  <path d="M51 15 L43 15 L32 37 L32 49 Z" fill="#ef4444" />
</svg>
